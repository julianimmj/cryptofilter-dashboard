name: Manter Streamlit Ativo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping app 1
        run: |
          echo "Acessando: https://cryptofilter-dashboard.streamlit.app/"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 120 --retry 3 --retry-delay 10 "https://cryptofilter-dashboard.streamlit.app/")
          echo "Status HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Aplicacao ativa e respondendo!"
          else
            echo "Aplicacao pode estar em repouso (status $HTTP_STATUS). Tentando wake-up..."
            curl -s -L --max-time 180 --retry 2 "https://cryptofilter-dashboard.streamlit.app/" > /dev/null 2>&1
            echo "Requisicao de wake-up enviada."
          fi

      - name: Ping app 2
        run: |
          echo "Acessando: https://cryptofilter.streamlit.app/"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 120 --retry 3 --retry-delay 10 "https://cryptofilter.streamlit.app/")
          echo "Status HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Aplicacao ativa e respondendo!"
          else
            echo "Aplicacao pode estar em repouso (status $HTTP_STATUS). Tentando wake-up..."
            curl -s -L --max-time 180 --retry 2 "https://cryptofilter.streamlit.app/" > /dev/null 2>&1
            echo "Requisicao de wake-up enviada."
          fi
